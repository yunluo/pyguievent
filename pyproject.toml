[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyguievent"
version = "0.0.11"
description = "A simple tool to create events to PySimpleGUI or FreeSimpleGUI"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "yunluo", email = "sp91@qq.com" }
]
keywords = [
    "pyguievent",
    "PySimpleEvent",
    "PySimpleGUI",
    "FreeSimpleGUI",
    "GUI",
    "events for simplegui"
]
requires-python = ">=3.4"

[project.urls]
Homepage = "https://github.com/yunluo/pyguievent"
Repository = "https://github.com/yunluo/pyguievent"
